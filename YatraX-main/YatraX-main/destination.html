<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YatraX | Destination</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="destination.css">
<link rel="stylesheet" href="reviews.css">
</head>
<body>

<button class="map-btn" onclick="openMap()">MAP</button>

<header>
    <div class="header-left">
        <a href="index.html" class="header-back">← Back</a>
        <a href="index.html" class="logo">Yatra<span>X</span></a>
    </div>
    <div class="header-nav">
        <a href="wishlist.html" class="nav-link">
            <span class="heart-emoji">❤️</span>
            <span id="wishlistBadge" class="wishlist-badge">0</span>
        </a>
        <div id="authArea" class="auth-area"></div>
    </div>
</header>

<div id="content"><div class="loading-msg">Loading destination...</div></div>

<!-- Reviews section (rendered by destination.js for the destination itself) -->
<section class="reviews-section" id="reviewsSection" style="display:none;">
  <div class="reviews-heading">
    <h2 id="reviewsTitle">Reviews & Comments</h2>
    <p>Share your experience with other travellers.</p>
  </div>

  <div class="review-write" id="reviewWriteForm" style="display:none;">
    <span class="write-label">Write a review</span>
    <div class="star-selector" id="starSelector">
      <span class="star" data-star="1">★</span>
      <span class="star" data-star="2">★</span>
      <span class="star" data-star="3">★</span>
      <span class="star" data-star="4">★</span>
      <span class="star" data-star="5">★</span>
    </div>
    <textarea id="reviewText" placeholder="Share your experience..."></textarea>
    <button class="post-btn" onclick="submitReview()">Post Review</button>
  </div>

  <div class="login-prompt" id="loginPromptBox" style="display:none;">
    Please <a href="auth.html">login</a> to write a review, like, or reply.
  </div>

  <div class="review-list" id="reviewList"></div>
</section>

<script src="common.js"></script>
<script src="reviews.js"></script>
<script src="destination.js"></script>
</body>
</html>
